name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只讀：CI 只需要取出程式碼，不需要寫入權限（task#64）
permissions:
  contents: read

# 同一分支推了新 commit 就取消還在跑的舊工作
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # 卡住的工作不要一直佔著 runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @billing/ui build-storybook
